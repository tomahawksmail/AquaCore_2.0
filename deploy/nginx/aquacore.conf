# Replace aquacore.example.com and TLS certificate paths before enabling.
# Nginx and Gunicorn run on the SAME Linux host.
server {
    listen 80;
    server_name aquacore.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aquacore.example.com;

    ssl_certificate /etc/letsencrypt/live/aquacore.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aquacore.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AquaCoreSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 16k;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_redirect off;
    }
}
